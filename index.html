<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>المدفوعات عبر الهاتف المحمول والشمول المالي في الجزائر</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--n:#071426;--m:#0B1F38;--c:#00D9FF;--b:#246BFD;--v:#8067FF;--w:#F4F8FC;--t:#9DB0C8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,sans-serif;color:var(--w);line-height:1.9;background:linear-gradient(rgba(0,217,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.04) 1px,transparent 1px),radial-gradient(circle at 80% 0,#0B1F38,#071426 65%);background-size:40px 40px,40px 40px,auto;background-attachment:fixed;background-color:var(--n)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5;pointer-events:none}
#side{position:fixed;top:0;right:0;bottom:0;width:260px;background:rgba(11,31,56,.88);backdrop-filter:blur(14px);border-left:1px solid rgba(0,217,255,.15);padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;overflow:auto;z-index:20;transition:transform .3s}
#side h1{font-size:14px;color:var(--c);margin:0 8px 14px;line-height:1.6}
#side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--t);text-decoration:none;font-size:14px;border:1px solid transparent}
#side a em{font-style:normal;font-size:11px;color:var(--c);min-width:20px}
#side a:hover{background:rgba(255,255,255,.05);color:var(--w)}#side a.act{background:rgba(0,217,255,.1);border-color:rgba(0,217,255,.4);color:var(--w)}
.sb{margin:12px 8px 0;display:flex;gap:6px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--b),var(--v));transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(36,107,253,.4)}button.g{background:rgba(255,255,255,.07);border:1px solid rgba(0,217,255,.3);color:var(--w)}
main{margin-right:260px;position:relative;z-index:1}
.page{display:none;padding:48px 5vw 100px;max-width:1150px;margin:auto}.page.on{display:block;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:clamp(24px,4vw,34px);margin-bottom:6px;background:linear-gradient(90deg,var(--w),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--t);margin-bottom:24px}h3{font-size:18px;margin:26px 0 10px;color:var(--c)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:12px 0}
.card,.st,.acc{background:rgba(255,255,255,.045);border:1px solid rgba(157,176,200,.18);border-radius:16px;backdrop-filter:blur(8px);padding:18px;transition:.25s}
.card:hover,.st:hover,.acc:hover{border-color:rgba(0,217,255,.5);transform:translateY(-2px)}
.st b{display:block;font-size:30px;color:var(--c);line-height:1.3}.st span{display:block;font-size:14px}.st small{color:var(--t);font-size:12px}
.acc h4{display:flex;justify-content:space-between;cursor:pointer;font-size:16px}.acc h4 i{font-style:normal;color:var(--c);transition:.2s}
.acc .b{display:none;color:var(--t);margin-top:10px;font-size:15px}.acc.open{border-color:var(--c)}.acc.open .b{display:block}.acc.open h4 i{transform:rotate(45deg)}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px;background:rgba(128,103,255,.2);color:#C8BEFF;border:1px solid var(--v)}.tag.ok{background:rgba(0,217,255,.12);color:var(--c);border-color:var(--c)}.tag.w{background:rgba(255,180,60,.12);color:#FFC46B;border-color:#FFC46B}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;min-height:56vh}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.4;margin:14px 0}.hero p{color:var(--t);margin-bottom:22px}.btns{display:flex;gap:10px;flex-wrap:wrap}.ph{width:100%;max-width:300px;margin:auto;filter:drop-shadow(0 0 30px rgba(0,217,255,.3))}
.cv{height:280px;position:relative}.ch .meta{font-size:12px;color:var(--t);margin-bottom:8px}.ch p{font-size:14px;color:var(--t);margin-top:10px}.ch .src{font-size:12px;border-top:1px dashed rgba(157,176,200,.3);padding-top:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button{background:rgba(255,255,255,.06);border:1px solid rgba(157,176,200,.25)}.tabs button.on{background:linear-gradient(135deg,var(--b),var(--v))}
.det{min-height:120px}.det dt{color:var(--c);font-size:13px;margin-top:8px}.det dd{margin:0;color:var(--w);font-size:15px}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;margin:16px 0}.flow button{background:rgba(255,255,255,.06);border:1px solid rgba(0,217,255,.35)}.flow button.on{background:linear-gradient(135deg,var(--b),var(--v))}.flow .ar{color:var(--c)}
.out{padding:14px 20px;border-radius:14px;background:rgba(0,217,255,.12);border:1px solid var(--c)}
.tl{border-right:2px solid var(--c);padding-right:20px;margin:16px 6px}.tl>div{position:relative;margin-bottom:22px}.tl>div:before{content:'';position:absolute;right:-27px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c)}.tl b{color:var(--c)}
.rec{display:grid;grid-template-columns:50px 1fr;gap:14px}.rec .nm{font-size:30px;font-weight:700;color:var(--v)}.rec small{color:var(--c)}
.key{margin:22px 0;padding:24px;border-radius:18px;font-size:20px;background:linear-gradient(135deg,rgba(36,107,253,.25),rgba(128,103,255,.25));border:1px solid var(--c);box-shadow:0 0 30px rgba(0,217,255,.15)}
.note{font-size:13px;color:var(--t);margin:10px 0}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#pr{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--c),var(--v));z-index:50}
#up{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:18px;z-index:30;display:none;border-radius:50%;width:46px;height:46px;padding:0}
#ind,#ex{display:none;position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom,0px))}#ind{right:50%;transform:translateX(50%);background:rgba(11,31,56,.9);border:1px solid var(--c);padding:6px 18px;border-radius:99px;font-size:14px}#ex{right:18px;padding:8px 14px}
#mb{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:30;padding:8px 14px}
.pm #side,.pm #mb{display:none}.pm main{margin:0}.pm .page{max-width:1300px;font-size:1.12em}.pm #ind,.pm #ex{display:block}
@media(max-width:900px){#side{transform:translateX(100%)}#side.open{transform:none}main{margin:0}#mb{display:block}.page{padding-top:64px}.hero{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}}
@media print{#side,#mb,#pr,#up,#ind,#ex,#bg,.btns,.tabs,.flow button{display:none!important}main{margin:0}.page{display:block!important;page-break-after:always;animation:none}.acc .b{display:block}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

<aside id="side"><h1>المدفوعات عبر الهاتف المحمول والشمول المالي في الجزائر</h1><nav id="nav"></nav><div class="sb"><button class="g" onclick="pm()">▶ وضع العرض</button><button class="g" onclick="window.print()">🖨 طباعة</button></div></aside>

<script>
const $=s=>document.querySelector(s),side=$('#side');
const A=(t,b)=>`<div class="acc"><h4>${t}<i>+</i></h4><div class="b">${b}</div></div>`;
const ST=(v,l,m,n,d,s)=>`<div class="st"><b${n!=null?` data-n="${n}" data-d="${d}" data-s="${s}"`:''}>${v}</b><span>${l}</span><small>${m}</small></div>`;
const CC=(id,t,u,p,i,s)=>`<div class="card ch"><h4>${t}</h4><div class="meta">الوحدة: ${u} · الفترة: ${p}</div><div class="cv"><canvas id="${id}" data-c="${id}"></canvas></div><p>${i}</p><p class="src">${s}</p></div>`;
const GIE='المصدر: مجمع النقد الآلي (GIE Monétique) كما نقلته وكالة الأنباء الجزائرية ومنابر إخبارية اقتصادية (مصدر ثانوي).';
const FX='المصدر: Global Findex (البنك الدولي).';
const PR=[
['بريدي موب','تطبيق دفع محمول لبريد الجزائر.','2017','يعتمد على قاعدة نحو 27.5 مليون حساب بريدي جاري (CCP) وأكثر من 4000 مكتب بريد.','أوسع انتشار جغرافي بما فيه المناطق الريفية.','مرتبط بوجود حساب بريدي جاري.'],
['وِمْ باي (Wimpay)','تطبيق دفع وتحويل يُذكر في البحث مع التطبيقات المصرفية.','غير مذكور في نص البحث','تحويل بين الأفراد (P2P) ودفع بالـ QR.','توسيع الاستخدام لدى أصحاب الحسابات.','مرتبط بحساب مصرفي؛ تفاصيله محدودة في البحث.'],
['DZ Mob Pay','نظام دفع محمول بين البنوك عبر مجمع النقد الآلي.','بداية 2025','مسح رمز QR موحد للدفع أو التحويل في أقل من 10 ثوانٍ، لعميل أي بنك مشارك. بدأ بسبعة بنوك (BNA، CPA، BDL، BEA، CNEP-Banque، AGB، Al Salam) إضافة إلى بريد الجزائر، ويُخطط لـ 15 بنكًا في 2026.','قابلية التشغيل البيني بين البنوك. بلغ نحو 79 ألف مستخدم و11.9 ألف تاجر (بداية نوفمبر 2025)، ثم قرابة 95 ألف حساب شخصي و14.3 ألف حساب تاجر نهاية 2025 (مصادر ثانوية).','قاعدة مستخدمين صغيرة مقارنة بـ 27.5 مليون حساب بريدي، وهو لا يزال في بداية التوسع.'],
['باري باي (Baridi Pay)','خدمة من بريد الجزائر لدفع المشتريات عبر QR دون بطاقة أو نقد.','14 جوان 2025','يشترط للتاجر حساب جار تجاري وسجل تجاري وبطاقة تعريف جبائية.','فتح قناة دفع رقمي لدى التجار عبر قاعدة بريد الجزائر.','شروط التسجيل تقصي التجار غير الرسميين.'],
['المحوّل المحمول (Switch Mobile)','خدمة أتاحت قابلية التشغيل البيني بين البنوك.','جوان 2024','ربط التطبيقات المصرفية بدل الاقتصار على الحلقة المغلقة لكل بنك.','تجاوز تفتت الحلول.','لا يقدم البحث تفاصيل أخرى عنه.'],
['التطبيقات المصرفية','مثل تطبيق BNA وBDL.','غير مذكور في نص البحث','تحويل بين الأفراد ودفع بالـ QR. أدرج بنك الجزائر خدمة QR داخل البنك الواحد للأفراد والمهنيين والتجار.','69.3 مليون عملية QR داخل البنك الواحد في 2025.','حلقة مغلقة لكل بنك لسنوات، وتخدم أصحاب الحسابات.']];
const F=['المزود','التعريف','تاريخ الإطلاق','آلية العمل','الدور في الشمول المالي','أبرز القيود'];
const MC=[['خفض كلفة الوصول','الهاتف الذكي يغني عن التنقل إلى الفروع، وهو ما يفيد سكان المناطق النائية.'],['تقليص تكلفة ومخاطر النقد','بديل أرخص وأكثر أمانًا من حمل النقد، ويكمل تدابير قانون المالية 2025 التي تحد من المدفوعات النقدية الكبيرة (كحظر النقد في المعاملات العقارية).'],['بناء سجل مالي رقمي','كل معاملة تترك أثرًا يمكن أن يدعم لاحقًا الحصول على الائتمان والتصريح الجبائي.'],['دعم التجار الصغار','قبول الدفع بالـ QR لا يتطلب جهاز دفع إلكتروني (TPE) مكلفًا، خلافًا للبطاقة.'],['منصة لخدمات أوسع','دفع الفواتير وشحن الرصيد، وصولًا إلى الادخار والتمويل المصغر مستقبلًا.']];
const P=[
['الرئيسية',`<div class="hero"><div><span class="tag">بحث تحليلي — نوفمبر 2026</span><h1>المدفوعات عبر الهاتف المحمول كأداة لتعزيز الشمول المالي في الجزائر</h1><p>يحلل البحث نمو الدفع المحمول في الجزائر ويسأل: هل تحول هذا النمو إلى شمول مالي فعلي، أم بقي داخل قاعدة حاملي الحسابات الموجودة؟</p><div class="btns"><button onclick="show(1)">ابدأ القراءة</button><button class="g" onclick="show(5)">التحليل الإحصائي</button><button class="g" onclick="pm()">وضع العرض</button></div></div>
<svg class="ph" viewBox="0 0 220 300"><rect x="40" y="10" width="140" height="280" rx="24" fill="#0B1F38" stroke="#00D9FF" stroke-width="2"/><rect x="62" y="50" width="96" height="96" rx="10" fill="#071426" stroke="#246BFD"/><g fill="#00D9FF"><rect x="72" y="60" width="26" height="26"/><rect x="122" y="60" width="26" height="26"/><rect x="72" y="110" width="26" height="26"/><rect x="108" y="96" width="12" height="12"/><rect x="128" y="112" width="20" height="20"/><rect x="106" y="124" width="12" height="12"/></g><rect x="62" y="166" width="96" height="30" rx="8" fill="#246BFD"/><text x="110" y="187" fill="#fff" font-size="15" text-anchor="middle">DZD ⇄ QR</text><rect x="62" y="208" width="96" height="10" rx="5" fill="#8067FF" opacity=".6"/><rect x="62" y="226" width="64" height="10" rx="5" fill="#9DB0C8" opacity=".4"/></svg></div>
<div class="g2">${ST('44%','ملكية حساب لدى البالغين','Global Findex · 2021',44,0,'%')}${ST('58.47 مليون','معاملة دفع عبر الهاتف','2024 · +49% عن 2023',58.47,2,' مليون')}${ST('939 مليار دج','إجمالي المدفوعات الإلكترونية','2025 · +46%',939,0,' مليار دج')}${ST('22 مليون','بطاقة مصرفية متداولة (أكثر من)','2025',22,0,' مليون')}</div>`],
['الملخص التنفيذي',`<p class="lead">اضغط على أي بطاقة لعرض التفاصيل.</p><div class="g2">${A('ملخص البحث','يتناول البحث دور المدفوعات عبر الهاتف في تعزيز الشمول المالي في الجزائر، بتتبع المنظومة (بريدي موب، وِمْ باي، DZ Mob Pay، باري باي)، وعرض أهم المؤشرات الكمية، وتحليل الإطار التنظيمي لمزودي خدمات الدفع، ثم تشخيص التحديات واقتراح توصيات.')}${A('الإشكالية','إلى أي مدى أسهمت المدفوعات عبر الهاتف المحمول في تعزيز الشمول المالي في الجزائر، وما الشروط اللازمة لتحويل نموها الكمي إلى أثر شمولي فعلي؟')}${A('الفرضيات','1) يرتبط تطور المدفوعات المحمولة ارتباطًا إيجابيًا بتوسع استخدام الخدمات المالية الرسمية.<br>2) أثرها على الفئات المستبعدة مشروط بتوفر الحساب، والهوية الرقمية، والثقة، والثقافة المالية.')}${A('المنهج','منهج وصفي تحليلي يعتمد على بيانات رسمية من مجمع النقد الآلي وبنك الجزائر، وبيانات Global Findex للبنك الدولي، ودراسات أكاديمية جزائرية. <br><span class="tag w">ملاحظة منهجية</span> بعض الأرقام من مواقع إخبارية متخصصة ثانوية المصدر، وقد أُشير إلى ذلك.')}${A('أبرز النتائج','النمو في حجم المعاملات المحمولة سريع ومؤكد، لكن أثره على الشمول المالي محدود لأن جزءًا كبيرًا منها يتم داخل قاعدة حاملي الحسابات الموجودة أصلًا، بينما تبقى النساء والريف وذوو الدخل المحدود وغير الموظفين خارج هذا المسار.')}</div>`],
['الإطار المفاهيمي',`<p class="lead">أربعة أبعاد وخمسة مفاهيم أساسية.</p><h3>الأبعاد الأربعة للشمول المالي</h3><div class="g2">${A('1 · الوصول','امتلاك حساب.')}${A('2 · الاستخدام','مدفوعات، ادخار، اقتراض.')}${A('3 · الجودة','ملاءمة الخدمة وتكلفتها.')}${A('4 · الرفاه','الأثر على حياة المستفيد.')}</div><h3>المفاهيم</h3><div class="g2">${A('الشمول المالي','تمكين الأفراد والمؤسسات من الوصول إلى خدمات مالية مناسبة وبتكلفة معقولة واستخدامها؛ ركيزة للتنمية المستدامة والحد من الفقر.')}${A('الدفع عبر الهاتف المحمول','إجراء عمليات الدفع والتحويل عبر تطبيق على الهاتف الذكي، وبرزت الهواتف عالميًا كأقوى قناة لتوسيع الوصول المالي لأنها تتجاوز كلفة الفروع.')}${A('التحويل بين الأفراد (P2P)','إحدى صيغتي الدفع المحمول: تحويل الأموال بين الأفراد.')}${A('الدفع بالـ QR','الصيغة الثانية: الدفع لدى التجار، غالبًا بمسح رمز الاستجابة السريعة.')}</div><h3>Mobile Banking مقابل Mobile Money</h3><div class="cmp"><div class="card"><span class="tag ok">النموذج الجزائري السائد</span><p>مرتبط بالحساب المصرفي أو البريدي. يعزز <b>الاستخدام</b> أكثر مما يوسع <b>الوصول</b>.</p></div><div class="card"><span class="tag">النقود المحمولة (إفريقيا جنوب الصحراء)</span><p>تعتمد على متعاملي الاتصالات ووكلاء نقديين دون حاجة إلى حساب مصرفي.</p></div></div>`],
['الشمول المالي في الجزائر',`<p class="lead">متأخرة مقارنة بالمنطقة؛ لكل مؤشر سنته ومصدره.</p><div class="g2">${ST('44%','ملكية الحساب','Global Findex · 2021',44,0,'%')}${ST('23%','ملكية بطاقة خصم','Global Findex · 2021',23,0,'%')}${ST('3%','ملكية بطاقة ائتمان','Global Findex · 2021',3,0,'%')}${ST('13%','استخدام المدفوعات الرقمية','أدنى معدل في MENA · Findex (السنة غير مكررة صراحة في النص)',13,0,'%')}${ST('31%','نساء يملكن حسابًا','2021',31,0,'%')}${ST('≈34 نقطة','الفجوة بين الجنسين','الأعلى عربيًا · مرصد FinDev Gateway',null)}</div><div class="g2">${CC('c41','مؤشرات الشمول المالي','% من البالغين','2021','أغلبية البالغين لديهم حساب أو أقل، لكن بطاقات الائتمان والمدفوعات الرقمية شبه غائبة.',FX)}${CC('c42','النساء الناشطات وغير الناشطات اقتصاديًا','% لديهن حساب','السنة غير مذكورة في النص','49% من النساء الناشطات اقتصاديًا لديهن حساب مقابل 12% فقط من غير الناشطات: الاستبعاد مرتبط بالعمل والدخل.','المصدر: بيانات البنك الدولي كما وردت في البحث.')}</div><div class="note"><span class="tag w">تباين المصادر</span> دراسة جزائرية (بيانات 2014–2024) تشير إلى تراجع ملكية الحسابات إلى نحو 35% في 2024، بينما تشير وثائق استراتيجية التكنولوجيا المالية إلى قاعدة انطلاق 43%. يُنصح بالرجوع إلى بيانات Findex الأصلية قبل الاستشهاد بنسبة 2024. وتُرجع الدراسات الضعف إلى غياب الثقافة المالية وقلة الحملات التحسيسية والفجوات حسب التعليم والدخل.</div>`],
['منظومة الدفع المحمول',`<p class="lead">اختر مزودًا لعرض بطاقته.</p><div class="tabs" id="tabs">${PR.map((p,i)=>`<button data-k="${i}" class="${i?'':'on'}">${p[0]}</button>`).join('')}</div><div class="card"><dl class="det" id="det"></dl></div><h3>خريطة المنظومة</h3><svg viewBox="0 0 640 300" style="width:100%;max-width:700px;display:block;margin:auto" font-family="inherit" font-size="14" text-anchor="middle"><g stroke="#00D9FF" stroke-opacity=".5" stroke-width="1.5"><line x1="320" y1="122" x2="320" y2="60"/><line x1="320" y1="178" x2="320" y2="240"/><line x1="410" y1="150" x2="500" y2="150"/><line x1="230" y1="150" x2="140" y2="150"/></g><g fill="#0B1F38" stroke="#246BFD"><rect x="230" y="122" width="180" height="56" rx="14" stroke="#00D9FF"/><rect x="250" y="14" width="140" height="46" rx="12"/><rect x="250" y="240" width="140" height="46" rx="12"/><rect x="500" y="127" width="130" height="46" rx="12"/><rect x="10" y="127" width="130" height="46" rx="12"/></g><g fill="#F4F8FC"><text x="320" y="146">مزودو خدمات الدفع</text><text x="320" y="166" fill="#00D9FF">DZ Mob Pay · GIE</text><text x="320" y="42">البنوك</text><text x="320" y="268">بريد الجزائر</text><text x="565" y="155">المستهلكون</text><text x="75" y="155">التجار (QR)</text></g></svg><p class="note">مخطط مبسط للعلاقات الواردة في البحث وليس مخططًا رسميًا.</p>`],
['التحليل الإحصائي',`<p class="lead">مؤشرات مختلفة لا يجوز دمجها أو اعتبارها متطابقة: الدفع المحمول، P2P، QR، الدفع عبر الإنترنت، إجمالي المدفوعات الإلكترونية.</p><div class="g2">${ST('+49%','نمو معاملات الهاتف','2024 مقابل 2023',null)}${ST('+31%','نمو تحويلات P2P','2025',null)}${ST('+19%','نمو QR داخل البنك الواحد','2025',null)}${ST('+46%','نمو إجمالي المدفوعات الإلكترونية','2025',null)}${ST('+179%','نمو الدفع عبر الإنترنت','2025',null)}${ST('22 مليون+','بطاقة مصرفية متداولة','2025',22,0,' مليون')}</div><div class="note">معدلات النمو لا تُقارن ببعضها: لكل مؤشر فترة وقاعدة مختلفة.</div><div class="g2">${CC('c61','معاملات الدفع عبر الهاتف','مليون معاملة','2023 (مشتقة) و2024','58.47 مليون معاملة في 2024 بنمو 49%. عمود 2023 قيمة مشتقة حسابيًا (58.47 ÷ 1.49 ≈ 39.2) وليست رقمًا منشورًا.',GIE)}${CC('c62','الدفع المحمول: عدد وقيمة','مليون معاملة / مليار دج','جانفي–جويلية 2025','39.7 مليون معاملة بقيمة 31.3 مليار دج. فترة سبعة أشهر لا تُقارن بسنة 2024 الكاملة.',GIE)}${CC('c63','تحويلات P2P','مليون معاملة / مليار دج','جانفي–جويلية 2025 مقابل 2025 كاملة','من 26.2 مليون (354.8 مليار دج) في سبعة أشهر إلى 47.5 مليون (647.4 مليار دج) في السنة، بنمو سنوي 31%. المقارنة بين فترتين من السنة نفسها وليست سلسلة سنوات.',GIE)}${CC('c64','QR داخل البنك الواحد','مليون عملية / مليار دج','2025','69.3 مليون عملية (+19%) بقيمة 57.3 مليار دج، وهي عمليات داخل كل بنك على حدة.',GIE)}${CC('c65','الإلكترونية الكلية والدفع عبر الإنترنت','مليار دج','2025','إجمالي المدفوعات الإلكترونية (TPE + إنترنت + هاتف) 939 مليار دج (+46%، نحو 7 مليارات دولار)، والدفع عبر الإنترنت 145 مليار دج (+179%) وهو جزء من الإجمالي.',GIE)}</div>`],
['التفسير التحليلي',`<div class="g2">${ST('≈ 790 دج','متوسط قيمة معاملة الدفع المحمول','31.3 مليار ÷ 39.7 مليون · جانفي–جويلية 2025 (تقريبي)',790,0,' دج')}${ST('≈ 13,542 دج','متوسط قيمة تحويل P2P','354.8 مليار ÷ 26.2 مليون · جانفي–جويلية 2025 (تقريبي)',13542,0,' دج')}</div><div class="card"><b>الدلالة:</b> صغر متوسط معاملة الدفع المحمول يوحي بدفعات يومية صغيرة، بينما تتركز القيمة الكبرى في تحويلات P2P. يدل ذلك على أن الهاتف يُستعمل أساسًا لتحويل الأموال بين الأفراد أكثر من الدفع لدى التجار.</div><div class="g2">${A('لماذا لا يعني نمو المعاملات نمو الشمول؟','عدد المعاملات لا يساوي عدد المشمولين. النمو يعكس تكثيف استخدام حاملي الحسابات الحاليين، ولا تتوفر إحصاءات رسمية منشورة تبيّن عدد من دخلوا النظام المالي الرسمي لأول مرة بفضل الدفع المحمول.')}${A('أصحاب الحسابات مقابل المشمولين حديثًا','النموذج الحالي يخدم أساسًا من يملك حسابًا، لذلك يعزز الاستخدام داخل القاعدة القائمة، بينما تبقى الفئات المستبعدة خارج المسار.')}${A('حدود الإحصاءات الحالية','1) لا إحصاءات عن المستخدمين الجدد للنظام المالي.<br>2) DZ Mob Pay جديد وقاعدته (قرابة 95 ألفًا) صغيرة مقابل 27.5 مليون حساب بريدي، ومصادرها ثانوية.<br>3) تباين المصادر في نسبة ملكية الحسابات لعام 2024.')}</div><div class="cmp"><div class="card"><span class="tag ok">قاعدة حاملي الحسابات</span><p>معاملات أكثر ← نمو مؤكد في الاستخدام.</p></div><div class="card"><span class="tag w">المستبعدون</span><p>لا حساب ← لا وصول إلى المسار ← أثر شمولي غير مثبت.</p></div></div>`],
['آليات الشمول المالي',`<p class="lead">اضغط على آلية لعرض شرحها.</p><div class="flow"><div class="out">الدفع المحمول</div><span class="ar">◄</span><div class="flow" style="margin:0" id="mech">${MC.map((m,i)=>`<button data-m="${i}" class="${i?'':'on'}">${i+1} · ${m[0]}</button>`).join('')}</div><span class="ar">◄</span><div class="out">الوصول · الاستخدام · الجودة · الرفاه</div></div><div class="card" id="mdet"></div><p class="note">وتدعم دراسة ميدانية جزائرية على وكالات بنكية وجود أثر ذي دلالة إحصائية لآليات تطوير وسائل الدفع الإلكتروني على الشمول المالي، مع اعتبار موظفي البنوك حلول الدفع المحمول والدفع عبر الإنترنت أنجع الآليات.</p>`],
['الإطار التنظيمي',`<p class="lead">التسلسل الزمني مع تمييز مستوى التوثيق.</p><div class="tl"><div><b>2023</b> · قانون النقد والقرض <span class="tag ok">وارد في البحث كمعلومة تنظيمية</span><p>أنشأ صفة «مزود خدمات الدفع» (PSP) لغير البنوك.</p></div><div><b>2024–2030</b> · استراتيجية التكنولوجيا المالية <span class="tag w">تفاصيل من مصادر ثانوية</span><p>تستهدف بحسب مصادر متخصصة 50% من المعاملات بلا نقد بحلول 2030، وبيئة اختبار تنظيمية (Sandbox) تستقبل 20 شركة ناشئة سنويًا. لم تُتحقق التفاصيل من الوثيقة الرسمية.</p></div><div><b>17 أوت 2025</b> · التعليمة 06-2025 <span class="tag ok">وارد في البحث كمعلومة تنظيمية</span><p>أول إطار خاص بمزودي خدمات الدفع: محافظ رقمية بمستويات متدرجة، وشبكات وكلاء دفع، وحماية أموال الزبائن. تعيين الوكلاء يفتح الباب لمعالجة اعتماد الجزائريين على النقد وسعة جغرافيتها.</p></div><div><b>سبتمبر 2026</b> · ترخيص Djezzy Payment Services <span class="tag ok">وفق ما ورد في البحث</span><p>قرر المجلس النقدي والمصرفي الترخيص المبدئي لفرع جيزي (نحو 18.1 مليون مشترك) لإنشاء مزود خدمات دفع، مع مهلة 12 شهرًا للترخيص النهائي. لا يجعل القرار جيزي بنكًا، لكنه يفتح الباب لمحافظ رقمية يقودها متعاملو الاتصالات، وهو الأهم من منظور الشمول لأنهم يملكون المشتركين وشبكات التوزيع وبيانات التعريف التي مكّنت النقود المحمولة من الانتشار في دول أخرى.</p></div></div>`],
['التحديات',`<div class="g2">${[['الاعتماد على حساب بنكي أو بريدي','من لا يملك حسابًا لا يستفيد، ما يحدّ من الأثر على المستبعدين.'],['الفجوة بين الجنسين','الاستبعاد مرتبط بالعمل والدخل لا بالتقنية وحدها، فتلزم سياسات موجهة.'],['الإقصاء الريفي','يتطلب سياسات موجهة، مع أثر لضعف الاتصال في المناطق النائية.'],['ضعف الثقافة المالية','من أبرز الأسباب في الدراسات الجزائرية، مع قلة الحملات التحسيسية.'],['ثقة المستهلك','الحاجة إلى حماية المستهلك ومعالجة الاحتيال.'],['الأمن السيبراني','الحاجة إلى حماية المستهلك ومعالجة الاحتيال.'],['الاتصال بالإنترنت','البنية التحتية وجودة الاتصال، خصوصًا في المناطق النائية.'],['تفتت الحلول','اقتصر الدفع لسنوات على الحلقة المغلقة لكل بنك، ولا يزال DZ Mob Pay في بداية التوسع.'],['حواجز تسجيل التجار','الارتباط بالسجل التجاري والجباية يقصي التجار غير الرسميين.'],['التحقق الرقمي من الهوية (eKYC)','لا تزال إجراءات التحقق تتطلب حضورًا فعليًا غالبًا.']].map(a=>A(a[0],a[1])).join('')}</div>`],
['التوصيات',`<p class="lead">سبع توصيات كخارطة طريق. صيغ عمودا «المشكلة» و«الإسهام المتوقع» استنادًا إلى تحديات البحث وآلياته.</p>${[['فتح الحسابات عن بعد','التحقق الرقمي من الهوية لفتح محفظة أو حساب مبسط عبر الهاتف.','التعريف الرقمي يتطلب حضورًا فعليًا، والارتباط بالحساب.','توسيع الوصول لمن لا يملك حسابًا.'],['تسريع محافظ متعاملي الاتصالات','تفعيل المحافظ بنظام المستويات والوكلاء مع تشغيل بيني مع DZ Mob Pay.','الاعتماد على النقد وعلى الحساب المصرفي.','بلوغ غير المتعاملين مع البنوك.'],['استهداف الفئات المستبعدة','برامج للنساء والريف والشباب، وربط صرف الأجور والتحويلات الاجتماعية بالمحافظ الرقمية.','فجوة الجنس والفجوة الريفية.','إدخال فئات خارج المسار الحالي.'],['التثقيف المالي الرقمي','حملات وطنية بالعربية والأمازيغية وإدماجها في المدارس والمؤسسات.','ضعف الثقافة المالية والرقمية.','رفع الاستخدام والثقة.'],['خفض الحواجز أمام التجار','تبسيط شروط التسجيل للتجار الصغار وتحفيز قبول الـ QR.','ارتباط التاجر بالسجل التجاري والجباية.','توسيع قبول الدفع الرقمي.'],['حماية المستهلك والأمن السيبراني','آليات شكاوى سريعة وحدود معاملات متدرجة.','ضعف الثقة والاحتيال.','بناء الثقة في القناة الرقمية.'],['إتاحة بيانات أدق','نشر إحصاءات دورية عن المستخدمين الجدد للنظام المالي مفصلة حسب الجنس والمنطقة.','غياب إحصاءات عن المشمولين حديثًا.','تقييم الأثر الشمولي فعليًا.']].map((r,i)=>`<div class="card rec" style="margin-bottom:12px"><div class="nm">${i+1}</div><div><b>${r[0]}</b><p>${r[1]}</p><small>المشكلة:</small> ${r[2]}<br><small>الإسهام المتوقع:</small> ${r[3]}</div></div>`).join('')}`],
['الخاتمة',`<div class="card"><p>يمثل الدفع عبر الهاتف المحمول في الجزائر فرصة حقيقية لتعزيز الشمول المالي، تؤكدها سرعة نمو المعاملات وإطلاق منظومات القابلية للتشغيل البيني والإطار القانوني الجديد.</p><p style="margin-top:10px">لكن الأثر الشمولي المثبت لا يزال أقل من حجم النمو المعلن، لأن النموذج الحالي يخدم أساسًا من يملك حسابًا.</p></div><div class="key">رقمنة الدفع ليست هي الشمول المالي الحقيقي: النمو في المعاملات سريع ومؤكد، لكن الفئات المستبعدة (النساء، الريف، ذوو الدخل المحدود، غير الموظفين) تبقى خارج المسار.</div><div class="card">يتوقف التحول من «رقمنة الدفع» إلى «شمول مالي حقيقي» على الاستفادة من الإطار التنظيمي الجديد، وإشراك متعاملي الاتصالات، وتبسيط إجراءات فتح الحسابات، وبناء الثقة والثقافة المالية الرقمية.</div>`],
['المراجع',`<p class="lead">مرتبة حسب الجهة، وفق ما ورد في نص البحث فقط. لم تتوفر عناوين المنشورات ولا الروابط ولا تواريخ النشر، ولذلك لم تُضف.</p><div class="g2">${[['البنك الدولي','بيانات Global Findex (ملكية الحساب والبطاقات والمدفوعات الرقمية 2021؛ بيانات النساء الناشطات وغير الناشطات اقتصاديًا).'],['بنك الجزائر','خدمة QR داخل البنك الواحد لفائدة الأفراد والمهنيين والتجار.'],['مجمع النقد الآلي (GIE Monétique)','بيانات معاملات الدفع المحمول وP2P وQR والمدفوعات الإلكترونية؛ نظام DZ Mob Pay.'],['وكالة الأنباء الجزائرية (APS)','نقل بيانات GIE Monétique للمعاملات والمدفوعات.'],['FinDev Gateway','تقدير الفجوة بين الجنسين (نحو 34 نقطة مئوية).'],['البحوث الأكاديمية','دراسة جزائرية تحلل بيانات 2014–2024 (ملكية الحسابات نحو 35% في 2024)؛ دراسة ميدانية على وكالات بنكية حول آليات تطوير الدفع الإلكتروني؛ دراسات جزائرية حول الثقافة المالية.'],['منابر إعلامية اقتصادية متخصصة','مصادر ثانوية: بيانات مستخدمي DZ Mob Pay وتجاره، تفاصيل استراتيجية التكنولوجيا المالية 2024–2030، وتفاصيل التنظيم.']].map(r=>`<div class="card"><h4 style="color:var(--c)">${r[0]}</h4><p class="note">${r[1]}</p></div>`).join('')}</div>`]];

r();addEventListener('resize',r);(function f(){x.clearRect(0,0,w,h);N.forEach((a,i)=>{a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;x.fillStyle='#00D9FF';x.beginPath();x.arc(a.x,a.y,1.6,0,7);x.fill();for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle='rgba(36,107,253,'+(.35*(1-d/130))+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}});requestAnimationFrame(f)})()})();
